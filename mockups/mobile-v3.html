<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hand Duel phone layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet" />
<style>
/* Mockup only: four phone layouts for the in-game screen. ?s=a|b|c|d */
:root {
  --glass: rgba(14, 16, 34, .72); --edge: rgba(255,255,255,.2);
  --text: #fff; --muted: #c9cdf0; --accent: #ffd23f; --p1: #3fe0ff; --p2: #ff8f45; --ok: #3ef08f; --power: #b98bff;
  --display: "Lilita One", system-ui, sans-serif; --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --safe-b: 20px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #07081a; color: var(--text); font-family: var(--body); overflow: hidden; }
.phone { position: relative; width: 100vw; height: 100dvh; overflow: hidden; }
.d { font-family: var(--display); letter-spacing: .02em; }
.glass { background: var(--glass); border: 1.5px solid var(--edge); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

/* fake camera feeds */
.feed { position: absolute; overflow: hidden; }
.feed.them { background: radial-gradient(120% 80% at 50% 30%, #6a4a7c 0%, #2b2140 55%, #15122a 100%); }
.feed.me { background: radial-gradient(120% 90% at 50% 35%, #3d6b86 0%, #1f3550 60%, #101a2c 100%); }
.feed svg.person { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 78%; opacity: .9; }
.feed .hand { position: absolute; font-size: 120px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.5)); }
.feed .tag { position: absolute; left: 10px; bottom: 10px; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: rgba(0,0,0,.55); }
.feed .tag b { color: var(--ok); }

/* shared HUD bits */
.hp { height: 12px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; }
.hp i { display: block; height: 100%; border-radius: 6px; }
.hp.l i { background: linear-gradient(90deg, var(--p1), #8af3ff); }
.hp.r i { background: linear-gradient(270deg, var(--p2), #ffbe85); margin-left: auto; }
.pips { display: flex; gap: 4px; } .pips i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid #fff9; } .pips i.on { background: var(--accent); border-color: #fff; }
.iconbtn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; }
.callout { position: absolute; font-size: 12px; color: #1d1b2e; background: var(--accent); padding: 4px 9px; border-radius: 8px; font-weight: 700; box-shadow: 0 4px 12px rgba(0,0,0,.4); z-index: 50; }
.callout::before { content: attr(data-n); display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: #1d1b2e; color: var(--accent); margin-right: 6px; font-size: 11px; }
.snapdot { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.55); }
.shout { position: absolute; left: 50%; transform: translateX(-50%) rotate(-4deg); font-family: var(--display); color: var(--accent);
  -webkit-text-stroke: 6px #1d1b2e; paint-order: stroke fill; text-shadow: 0 6px 0 #1d1b2e; white-space: nowrap; }
.label { position: absolute; top: 0; left: 0; right: 0; z-index: 60; text-align: center; font: 700 12px var(--body); color: #1d1b2e; background: var(--accent); padding: 3px; letter-spacing: .04em; text-transform: uppercase; }

/* ---------- A: video call ---------- */
.A .feed.them { inset: 0; }
.A .top { position: absolute; top: 34px; left: 12px; right: 12px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 18px; }
.A .top .n { display: flex; justify-content: space-between; font: 15px var(--display); margin-bottom: 5px; }
.A .round { text-align: center; font: 13px var(--display); color: var(--accent); }
.A .round small { display: block; font: 11px var(--body); color: var(--muted); }
.A .tile { position: absolute; right: 12px; bottom: 112px; width: 112px; height: 150px; border-radius: 18px; border: 2px solid var(--p1); box-shadow: 0 12px 30px rgba(0,0,0,.6); }
.A .tile .hand { font-size: 46px; left: 26px; top: 28px; }
.A .safe { position: absolute; left: 8px; right: 8px; top: 108px; bottom: 102px; border: 2px dashed rgba(63,224,255,.4); border-radius: 22px; }
.A .bar { position: absolute; left: 12px; right: 12px; bottom: var(--safe-b); height: 72px; border-radius: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
.A .bar .mid { font: 15px var(--display); padding: 0 6px; text-align: center; }
.A .bar .mid small { display: block; font: 11px var(--body); color: var(--muted); }
.A .edgeTab { position: absolute; left: 0; top: 46%; width: 18px; height: 70px; border-radius: 0 12px 12px 0; background: rgba(63,224,255,.65); display: none; }

/* ---------- B: stacked (top = them, bottom = you) ---------- */
.B .feed.them { left: 0; right: 0; top: 0; height: 47%; }
.B .feed.me { left: 0; right: 0; bottom: 0; height: 47%; }
.B .feed.me .tag { top: 12px; bottom: auto; }
.B .seam { position: absolute; left: 0; right: 0; top: 47%; height: 6%; background: #0b0c1d; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 0 12px; z-index: 3; border-top: 2px solid var(--p2); border-bottom: 2px solid var(--p1); }
.B .seam .n { display: flex; justify-content: space-between; font: 13px var(--display); margin-bottom: 4px; }
.B .vs { font: 22px var(--display); color: var(--accent); }
.B .them .hand { left: 50%; top: 30%; transform: translateX(-50%); font-size: 110px; }
.B .me .hand { left: 50%; top: 18%; transform: translateX(-50%); font-size: 96px; }
.B .more { position: absolute; right: 12px; top: 34px; z-index: 5; }
.B .pause { position: absolute; left: 12px; top: 34px; z-index: 5; }
.B .chips { position: absolute; left: 12px; bottom: calc(var(--safe-b) + 8px); display: flex; gap: 8px; z-index: 5; }
.B .chip { height: 44px; padding: 0 14px; border-radius: 22px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
.B .chip.on { background: var(--power); color: #170a33; border-color: transparent; }
.B .shout { top: 36%; transform: translate(-50%, -50%) rotate(-4deg); font-size: 64px; z-index: 6; }

/* ---------- C: fighter HUD with docked self portrait ---------- */
.C .feed.them { inset: 0; }
.C .them .hand { left: 50%; top: 34%; transform: translateX(-50%); font-size: 150px; }
.C .top { position: absolute; top: 34px; left: 12px; right: 12px; }
.C .bars { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; gap: 8px; }
.C .bars .hp { height: 16px; border: 2px solid rgba(0,0,0,.5); border-radius: 9px; }
.C .timer { width: 64px; height: 48px; border-radius: 14px; display: grid; place-items: center; font: 26px var(--display); background: #1d1b2e; border: 2px solid var(--accent); color: var(--accent); }
.C .names { display: flex; justify-content: space-between; margin-top: 6px; font: 15px var(--display); }
.C .dock { position: absolute; left: 0; right: 0; bottom: 0; height: 168px; background: linear-gradient(to top, rgba(7,8,26,.95) 55%, rgba(7,8,26,0)); }
.C .portrait { position: absolute; left: 14px; bottom: calc(var(--safe-b) + 6px); width: 118px; height: 118px; border-radius: 50%; border: 4px solid var(--p1); box-shadow: 0 0 0 4px #07081a, 0 10px 24px rgba(0,0,0,.6); }
.C .portrait .hand { font-size: 40px; left: 36px; top: 22px; }
.C .read { position: absolute; left: 112px; bottom: calc(var(--safe-b) + 92px); padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; background: var(--ok); color: #0b2a18; }
.C .actions { position: absolute; right: 14px; bottom: calc(var(--safe-b) + 6px); display: grid; grid-template-columns: repeat(3, 56px); gap: 10px; }
.C .actions .iconbtn { width: 56px; height: 56px; font-size: 24px; }
.C .actions .pw { grid-column: span 3; height: 48px; border-radius: 24px; display: flex; gap: 8px; justify-content: center; align-items: center; font-size: 14px; font-weight: 700; }
.C .actions .pw span { padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.12); }
.C .actions .pw span.on { background: var(--power); color: #170a33; }
.C .shout { top: 58%; font-size: 70px; }

/* ---------- D: focus mode with a pull-up sheet ---------- */
.D .feed.them { inset: 0; }
.D .them .hand { left: 50%; top: 30%; transform: translateX(-50%); font-size: 150px; }
.D .row { position: absolute; top: 34px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; }
.D .me-badge { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--p1); position: relative; flex: none; }
.D .me-badge .feed { inset: 0; border-radius: 50%; }
.D .me-badge .hand { font-size: 26px; left: 18px; top: 12px; }
.D .me-badge b { position: absolute; right: -6px; bottom: -6px; width: 28px; height: 28px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; font-size: 15px; border: 2px solid #07081a; }
.D .scores { flex: 1; padding: 8px 12px; border-radius: 16px; }
.D .scores .n { display: flex; justify-content: space-between; font: 14px var(--display); margin-bottom: 4px; }
.D .scores .hp + .n { margin-top: 6px; }
.D .shout { top: 60%; font-size: 72px; }
.D .sheet { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 26px 26px 0 0; padding: 10px 16px calc(var(--safe-b) + 6px); }
.D .grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.4); margin: 0 auto 12px; }
.D .sheet .hint { text-align: center; font-size: 13px; color: var(--muted); }
.D.open .sheet .hint { display: none; }
.D .sheet .grid { display: none; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 4px; }
.D.open .sheet .grid { display: grid; }
.D .sheet .grid div { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.D .sheet .grid .iconbtn { width: 60px; height: 60px; border-radius: 18px; background: rgba(255,255,255,.1); font-size: 24px; }
.D .sheet h4 { margin: 16px 0 8px; font: 14px var(--display); color: var(--muted); display: none; }
.D.open .sheet h4 { display: block; }
.D .sheet .lay { display: none; gap: 8px; }
.D.open .sheet .lay { display: flex; }
.D .sheet .lay span { flex: 1; text-align: center; padding: 12px 6px; border-radius: 14px; background: rgba(255,255,255,.08); font-size: 13px; }
.D .sheet .lay span.on { background: var(--p1); color: #062430; font-weight: 700; }
.D.open .dim { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const s = new URLSearchParams(location.search).get("s") || "a";
const person = `<svg class="person" viewBox="0 0 200 220"><circle cx="100" cy="70" r="46" fill="rgba(255,255,255,.18)"/><path d="M20 220c0-60 36-96 80-96s80 36 80 96z" fill="rgba(255,255,255,.14)"/></svg>`;
const them = (hand = "✋") => `<div class="feed them">${person}<div class="hand">${hand}</div></div>`;
const me = (hand = "✊", extra = "") => `<div class="feed me">${person}<div class="hand">${hand}</div>${extra}</div>`;
const pips = (n) => `<span class="pips">${[0, 1].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;
const callout = (n, text, css) => `<div class="callout" data-n="${n}" style="${css}">${text}</div>`;

const screens = {
  a: `<div class="phone A">
    ${them().replace('class="hand"', 'class="hand" style="left:22%;top:36%;font-size:130px"')}
    <div class="safe"></div>
    ${["top:116px;left:16px", "top:116px;right:16px", "bottom:112px;left:16px", "bottom:112px;right:16px"].map((p) => `<div class="snapdot" style="${p}"></div>`).join("")}
    <div class="top glass">
      <div><div class="n"><span>You</span>${pips(1)}</div><div class="hp l"><i style="width:70%"></i></div></div>
      <div class="round">R2<small>Dusk Dojo</small></div>
      <div><div class="n">${pips(0)}<span>Mika</span></div><div class="hp r"><i style="width:45%"></i></div></div>
    </div>
    <div class="shout" style="top:42%;font-size:72px">SHOOT!</div>
    <div class="feed me tile">${person}<div class="hand">✊</div></div>
    <div class="bar glass">
      <div class="iconbtn glass">⏸</div><div class="iconbtn glass">🎭</div>
      <div class="mid">Show your hand<small>tile dodges Mika's hand</small></div>
      <div class="iconbtn glass">🔊</div><div class="iconbtn glass">⋯</div>
    </div>
    ${callout(1, "Snaps to 4 corners only", "top:280px;left:110px")}
    ${callout(2, "Never enters the bar", "bottom:265px;right:20px")}
    ${callout(3, "Tap to swap · flick off edge to hide", "bottom:300px;left:16px")}
  </div>`,
  b: `<div class="phone B">
    ${them()}
    ${me("✊", `<div class="tag">You · <b>✊ rock</b></div>`)}
    <div class="seam">
      <div><div class="n"><span style="color:var(--p2)">Mika</span>${pips(0)}</div><div class="hp r"><i style="width:45%"></i></div></div>
      <div class="vs">R2</div>
      <div><div class="n">${pips(1)}<span style="color:var(--p1)">You</span></div><div class="hp l"><i style="width:70%"></i></div></div>
    </div>
    <div class="shout">SHOOT!</div>
    <div class="iconbtn glass pause">⏸</div><div class="iconbtn glass more">⋯</div>
    <div class="chips"><div class="chip glass">🛡 Shield</div><div class="chip on">💥 Power ready</div></div>
    ${callout(1, "No floating tile: nothing to overlap", "top:90px;left:70px")}
    ${callout(2, "Scores sit on the seam", "top:calc(53% + 8px);right:16px")}
    ${callout(3, "Power-ups by your thumb", "bottom:86px;left:16px")}
  </div>`,
  c: `<div class="phone C">
    ${them()}
    <div class="top">
      <div class="bars"><div class="hp l"><i style="width:70%"></i></div><div class="timer">3</div><div class="hp r"><i style="width:45%"></i></div></div>
      <div class="names"><span>You ${pips(1)}</span><span>${pips(0)} Mika</span></div>
    </div>
    <div class="shout">SHOOT!</div>
    <div class="dock"></div>
    <div class="feed me portrait">${person}<div class="hand">✊</div></div>
    <div class="read">✊ rock</div>
    <div class="actions">
      <div class="iconbtn glass">⏸</div><div class="iconbtn glass">🎭</div><div class="iconbtn glass">⋯</div>
      <div class="pw glass"><span>🛡</span><span class="on">💥 ready</span><span>🔄</span></div>
    </div>
    ${callout(1, "Your cam: fixed bubble in the dock", "bottom:170px;left:14px")}
    ${callout(2, "Fighting-game bars + timer", "top:120px;left:60px")}
  </div>`,
  d: `<div class="phone D ${new URLSearchParams(location.search).get("open") ? "open" : ""}">
    ${them()}
    <div class="row">
      <div class="me-badge"><div class="feed me">${person}<div class="hand">✊</div></div><b>✓</b></div>
      <div class="scores glass">
        <div class="n"><span>You</span>${pips(1)}</div><div class="hp l"><i style="width:70%"></i></div>
        <div class="n"><span>Mika</span>${pips(0)}</div><div class="hp r" style="direction:rtl"><i style="width:45%;margin-left:0"></i></div>
      </div>
    </div>
    <div class="shout">SHOOT!</div>
    <div class="dim"></div>
    <div class="sheet glass">
      <div class="grab"></div>
      <div class="hint">Swipe up for menu · power-ups by hand sign</div>
      <div class="grid">
        <div><span class="iconbtn">⏸</span>Pause</div><div><span class="iconbtn">🎭</span>Looks</div>
        <div><span class="iconbtn">🔊</span>Sound</div><div><span class="iconbtn">⚙️</span>Settings</div>
      </div>
      <h4>Layout</h4>
      <div class="lay"><span class="on">Them big</span><span>Me big</span><span>Split</span></div>
      <h4>Power-ups</h4>
      <div class="lay"><span>🛡 Shield</span><span class="on">💥 Power</span><span>🔄 Reverse</span></div>
    </div>
    ${new URLSearchParams(location.search).get("open") ? "" : callout(1, "Your cam: a small live badge", "top:108px;left:12px") + callout(2, "One handle, everything else hidden", "bottom:84px;left:60px")}
  </div>`,
};
const names = { a: "A · Video call", b: "B · Split stack", c: "C · Fighter HUD", d: "D · Focus + sheet" };
document.getElementById("root").innerHTML = screens[s] + `<div class="label">${names[s]}${new URLSearchParams(location.search).get("open") ? " (menu open)" : ""}</div>`;
</script>
</body>
</html>
