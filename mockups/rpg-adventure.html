<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hand Duel Adventure mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet" />
<style>
/* Mockup only (RPG phase v2): single-player adventure. All art is placeholder, drawn in code from layered
   "paper-doll" parts. Pick a screen with ?s=creator|roster|encounter|master */
:root {
  --glass: rgba(18, 20, 40, .82); --edge: rgba(255,255,255,.22);
  --text: #fff; --muted: #c9cdf0; --accent: #ffd23f; --ink: #1d1b2e; --paper: #fff8e7;
  --p1: #3fe0ff; --p2: #ff8f45; --ok: #3ef08f; --bad: #ff5d73; --power: #b98bff;
  --font-display: "Lilita One", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #1b1d33; }
body { color: var(--text); font-family: var(--font-body); font-size: 16px; }
canvas.px { image-rendering: pixelated; display: block; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
.glass { background: var(--glass); border: 1.5px solid var(--edge); border-radius: 18px; backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
.chip { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 99px; background: rgba(255,255,255,.12); white-space: nowrap; }
.chip.y { background: var(--accent); color: var(--ink); font-weight: 700; }
.chip.p { background: var(--power); color: #170a33; font-weight: 700; }
.chip.lock { background: rgba(0,0,0,.35); color: var(--muted); }

/* ---------- creator ---------- */
.creator { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; padding: 22px; height: 100vh; }
.creator h1 { margin: 0 0 4px; font-size: 34px; }
.creator .sub { color: var(--muted); margin-bottom: 14px; }
.stage { position: relative; border-radius: 22px; overflow: hidden; background: linear-gradient(#7ec8ff 0 55%, #5fb54d 55%); border: 4px solid var(--ink); display: flex; flex-direction: column; }
.stage .views { flex: 1; display: grid; grid-template-columns: 1fr 1.5fr 1fr; align-items: end; padding: 20px 20px 0; gap: 12px; }
.view { text-align: center; }
.view canvas { margin: 0 auto; }
.view .lab { display: inline-block; margin: 10px 0 18px; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; padding: 3px 10px; }
.stage .namebar { display: flex; gap: 10px; align-items: center; padding: 14px 18px; background: rgba(29,27,46,.88); }
.namebar .in { flex: 1; background: rgba(255,255,255,.1); border: 1.5px solid var(--edge); border-radius: 12px; padding: 10px 14px; font-size: 18px; }
.btn { border: 4px solid var(--ink); border-radius: 14px; padding: 10px 20px; background: var(--accent); color: var(--ink); font-family: var(--font-display); font-size: 20px; box-shadow: 0 5px 0 var(--ink); }
.btn.ghost { background: var(--paper); }
.panel { padding: 16px 18px; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,.08); font-weight: 700; font-size: 15px; }
.tab.on { background: var(--paper); color: var(--ink); }
.slot h3 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.items { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.item { position: relative; border-radius: 12px; background: rgba(255,255,255,.08); border: 2px solid transparent; aspect-ratio: 1; display: grid; place-items: center; }
.item.on { border-color: var(--accent); background: rgba(255,210,63,.16); }
.item.locked canvas { filter: brightness(.25) saturate(0); }
.item .lk { position: absolute; inset: auto 4px 4px auto; font-size: 13px; }
.item .tip { position: absolute; left: 50%; top: calc(100% + 6px); z-index: 2; transform: translateX(-50%); white-space: nowrap; font-size: 12px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; padding: 3px 8px; font-weight: 700; }
.sw { display: flex; gap: 8px; margin-top: 8px; }
.sw i { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); }
.sw i.on { border-color: #fff; box-shadow: 0 0 0 3px var(--accent); }
.packnote { margin-top: auto; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: rgba(185,139,255,.14); border: 1.5px dashed rgba(185,139,255,.6); font-size: 14px; color: var(--muted); }
.packnote b { color: #fff; }
.packnote code { font-size: 12px; color: #e3d6ff; }

/* ---------- roster ---------- */
.roster { padding: 22px 26px; }
.roster h1 { margin: 0; font-size: 32px; }
.roster .sub { color: var(--muted); margin: 2px 0 14px; }
.row { display: grid; gap: 12px; }
.masters { grid-template-columns: repeat(5, 1fr); }
.folk { grid-template-columns: repeat(6, 1fr); margin-top: 12px; }
.ncard { background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.ncard .pic { position: relative; display: grid; place-items: center; padding: 8px 0 0; }
.ncard .pic .lv { position: absolute; top: 8px; left: 8px; font-size: 12px; font-weight: 700; background: var(--ink); color: #fff; border-radius: 8px; padding: 2px 7px; }
.ncard .pic .tr { position: absolute; top: 8px; right: 8px; }
.ncard .body { padding: 8px 12px 12px; border-top: 4px solid var(--ink); flex: 1; display: flex; flex-direction: column; gap: 5px; }
.ncard .nm { font-family: var(--font-display); font-size: 20px; line-height: 1.05; }
.ncard .ti { font-size: 13px; color: #5a5677; margin-top: -3px; }
.ncard .k { font-size: 13px; line-height: 1.35; }
.ncard .k b { display: inline-block; min-width: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #8a5a3c; margin-right: 4px; }
.ncard .rw { margin-top: auto; font-size: 12px; font-weight: 700; background: #f1eadb; border-radius: 8px; padding: 4px 8px; }
.folk .ncard .nm { font-size: 18px; }
.datanote { margin-top: 14px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
.datanote pre { margin: 0; font-size: 11.5px; line-height: 1.45; color: #dfe3ff; padding: 12px 14px; overflow: hidden; }
.datanote pre .key { color: #7cf0ff; } .datanote pre .s { color: #ffd98a; } .datanote pre .n { color: #b8ffcf; }
.beh { padding: 12px 16px; font-size: 14px; color: var(--muted); }
.beh h3 { margin: 0 0 8px; color: #fff; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.beh .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

/* ---------- world scenes ---------- */
canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; }
.hud { position: fixed; inset: 0; pointer-events: none; }
.goal { position: absolute; top: 16px; left: 16px; padding: 10px 16px; display: flex; gap: 14px; align-items: center; }
.goal canvas { width: 52px; height: 52px; background: #2c3a63; border-radius: 12px; }
.goal .n { font-family: var(--font-display); font-size: 20px; }
.goal .s { font-size: 14px; color: var(--muted); }
.belts { position: absolute; top: 16px; right: 16px; padding: 10px 14px; display: flex; gap: 8px; align-items: center; }
.belts i { width: 34px; height: 14px; border-radius: 4px; border: 2px solid rgba(255,255,255,.4); }
.belts .coins { margin-left: 8px; font-weight: 700; }
.quest { position: absolute; top: 92px; left: 16px; padding: 8px 14px; font-size: 14px; }
.quest b { color: var(--accent); }
.dialog { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(1000px, 94vw);
  background: var(--paper); color: var(--ink); border: 6px solid var(--ink); border-radius: 14px;
  box-shadow: 0 0 0 6px var(--paper), 0 0 0 10px var(--ink), 0 18px 40px rgba(0,0,0,.5);
  display: grid; grid-template-columns: 140px 1fr; gap: 20px; padding: 18px 22px; }
.dialog canvas { width: 140px; height: 140px; background: #cfe3ff; border-radius: 10px; border: 4px solid var(--ink); }
.dialog .who { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
.dialog .who h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; }
.dialog .who .chip { background: #f1eadb; color: var(--ink); font-weight: 700; }
.dialog .who .chip.y { background: var(--accent); }
.dialog p { margin: 4px 0 12px; font-size: 20px; line-height: 1.4; }
.dialog p em { font-style: normal; background: #ffe98a; padding: 0 4px; border-radius: 4px; }
.dialog .next { float: right; font-size: 18px; animation: b 1s infinite; }
@keyframes b { 50% { transform: translateY(3px); } }
.choices { display: flex; gap: 12px; }
.choice { border: 4px solid var(--ink); border-radius: 12px; padding: 10px 16px; background: #fff; display: flex; gap: 10px; align-items: center; }
.choice b { font-family: var(--font-display); font-weight: 400; font-size: 20px; display: block; }
.choice small { font-size: 13px; color: #5a5677; }
.choice .ic { font-size: 26px; }
.choice.hot { background: var(--accent); box-shadow: 0 6px 0 var(--ink); transform: translateY(-3px); }
/* battle */
.bars { position: absolute; top: 16px; left: 16px; right: 16px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: start; }
.fighter { padding: 10px 14px; }
.fighter .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.fighter .top b { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.fighter .top span { color: var(--muted); font-size: 14px; }
.hp { height: 18px; border-radius: 9px; background: rgba(255,255,255,.12); margin-top: 8px; overflow: hidden; border: 2px solid rgba(0,0,0,.4); }
.hp i { display: block; height: 100%; border-radius: 7px; }
.chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.right .top { flex-direction: row-reverse; } .right .hp { direction: rtl; } .right .chips { justify-content: flex-end; }
.round { text-align: center; padding: 8px 18px; }
.round b { font-family: var(--font-display); font-weight: 400; font-size: 26px; display: block; }
.round span { color: var(--muted); font-size: 14px; }
.twist { position: absolute; top: 124px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.twist b { color: var(--accent); }
.say { position: absolute; padding: 10px 16px; background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 14px; font-weight: 700; font-size: 18px; }
.say:after { content: ""; position: absolute; bottom: -16px; left: 30px; border: 8px solid transparent; border-top-color: var(--ink); }
.shout { position: absolute; left: 50%; top: 47%; transform: translate(-50%,-50%) rotate(-4deg); font-family: var(--font-display);
  font-size: 84px; color: var(--accent); -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink); white-space: nowrap; }
.read { position: absolute; left: 16px; bottom: 16px; padding: 12px 16px; width: 330px; }
.read h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
.read .hist { display: flex; gap: 6px; margin-bottom: 8px; }
.read .hist span { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; background: rgba(255,255,255,.1); }
.read .hist span.w { box-shadow: inset 0 -4px 0 var(--bad); } .read .hist span.l { box-shadow: inset 0 -4px 0 var(--ok); }
.read .bar { display: grid; grid-template-columns: 26px 1fr 40px; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin: 3px 0; }
.read .bar i { height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; }
.read .bar i u { display: block; height: 100%; background: var(--p2); }
.read .hint { margin-top: 8px; font-size: 14px; color: #fff; background: rgba(255,210,63,.14); border-left: 4px solid var(--accent); padding: 6px 10px; border-radius: 6px; }
.selfcam { position: absolute; right: 16px; bottom: 16px; width: 250px; padding: 8px; }
.selfcam .v { height: 150px; border-radius: 12px; background: linear-gradient(160deg,#3a3550,#1c1a2a); position: relative; overflow: hidden; }
.selfcam svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.selfcam .cap { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 6px 4px 0; }
.selfcam .cap b { color: var(--ok); }
.ph { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 13px; color: var(--muted); padding: 6px 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const scene = new URLSearchParams(location.search).get("s") || "creator";
const INK = "#1d1b2e";
function shade(hex, a) { const n = parseInt(hex.slice(1), 16); const c = (v) => Math.max(0, Math.min(255, v + a)); return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`; }

// ================= layered "paper-doll" avatars =================
// Each part is rows of chars on a 16×20 grid; "." is transparent. Letters map to palette slots, so every part
// can be recoloured from the avatar data. Real packs would be sprite sheets with the same idea.
const G = 16, GH = 20;
const PARTS = {
  body: { base: [
    "................","................","................",
    ".....SSSSSS.....","....SSSSSSSS....","....SSSSSSSS....","....SSESSESS....","....SSSSSSSS....",".....SSMMSS.....","......SSSS......",
    "....TTTTTTTT....","...TTTTTTTTTT...","...STTTTTTTTS...","...STTTTTTTTS...","...S.BBBBBB.S...",
    ".....BBBBBB.....",".....BB..BB.....",".....BB..BB.....",".....FF..FF.....","....FFF..FFF...."] },
  hair: {
    none: [],
    short: [null, null, ".....HHHHHH.....", "....HHHHHHHH....", "...HHHHHHHHHH...", "...HH......HH...", "...H........H..."],
    spiky: ["....H..H..H.....", "....HH.HH.HH....", "...HHHHHHHHHH...", "...HHHHHHHHHHH..", "...HHHHHHHHHH...", "...HHH....HHH...", "...H........H..."],
    long: [null, null, ".....HHHHHH.....", "....HHHHHHHH....", "...HHHHHHHHHH...", "...HHH....HHH...", "...HH......HH...", "...HH......HH...", "...HH......HH...", "...HH......HH...", "...hH......Hh...", "...h........h..."],
    bun: ["......HHHH......", "......HHHH......", ".....HHHHHH.....", "....HHHHHHHH....", "...HHHHHHHHHH...", "...HH......HH..."],
    puff: ["....HHHHHHHH....", "...HHHHHHHHHH...", "..HHHHHHHHHHHH..", "..HHHHHHHHHHHH..", "..HHHHHHHHHHHH..", "..HHH......HHH..", "..HH........HH..", "...H........H..."],
  },
  top: {
    tee: [], // the base body already wears a tee
    gi: [...Array(10).fill(null), "....TTTttTTT....", "...TTTTTtTTTT...", "...TTTTTtTTTT...", "...SKKKKKKKKS..."],
    hoodie: [...Array(9).fill(null), "....T......T....", "....TTTTTTTT....", "...TTTTTTTTTT...", "...TTTTTTTTTT...", "...TTTttttTTT...", "...S........S..."],
    jacket: [...Array(10).fill(null), "....TTttttTT....", "...TTTttttTTT...", "...TTTttttTTT...", "...STTttttTTS..."],
  },
  bottom: {
    pants: [],
    shorts: [...Array(16).fill(null), ".....SS..SS.....", ".....SS..SS....."],
    skirt: [...Array(15).fill(null), "....BBBBBBBB....", "...BBBBBBBBBB...", ".....SS..SS....."],
    hakama: [...Array(15).fill(null), "....BBBBBBBB....", "....BBB..BBB....", "...BBBB..BBBB...", "...BBBB..BBBB..."],
  },
  hat: {
    none: [],
    cap: [null, null, "....AAAAAAA.....", "...AAAAAAAAA....", "...aaaaaaaaaaaa."],
    band: [...Array(4).fill(null), "...AAAAAAAAAA...", "............AA..", ".............A.."],
    straw: [null, "......AAAA......", ".....AAAAAA.....", ".....aaaaaa.....", ".AAAAAAAAAAAAAA."],
    crown: [null, "....A..A..A.....", "....AAAAAAA.....", "....aaaaaaa....."],
  },
  extra: {
    none: [],
    glasses: [...Array(6).fill(null), "....GgEggEgG...."],
    scarf: [...Array(9).fill(null), "....CCCCCCCC....", "....CCCCCCCC....", "...........CC...", "...........CC..."],
    mask: [...Array(7).fill(null), "....CCCCCCCC....", "....CCCCCCCC....", "......CCCC......"],
    cape: "back",
  },
};
const CAPE = [...Array(10).fill(null), "...CCCCCCCCCC...", "..CCCCCCCCCCCC..", "..CCCCCCCCCCCC..", "..CCCCCCCCCCCC..", "..CCCCCCCCCCCC..", "..cCCCCCCCCCCc..", "...cCCCCCCCCc...", "...cccccccccc..."];
const SKINS = ["#ffe0c4", "#f2c8a0", "#d9a277", "#b07a52", "#7f5539", "#5a3a26"];

function compose(av) {
  const grid = Array.from({ length: GH }, () => Array(G).fill("."));
  const paint = (rows) => rows.forEach((r, y) => { if (!r) return; [...r].forEach((ch, x) => { if (ch !== ".") grid[y][x] = ch; }); });
  if (av.extra === "cape") paint(CAPE);
  paint(PARTS.body.base);
  paint(PARTS.bottom[av.bottom] || []);
  paint(PARTS.top[av.top] || []);
  if (av.extra !== "cape") paint(PARTS.extra[av.extra] || []);
  paint(PARTS.hair[av.hair] || []);
  paint(PARTS.hat[av.hat] || []);
  const pal = {
    S: SKINS[av.skin ?? 1], E: INK, M: "#b5524a",
    H: av.hairColor, h: shade(av.hairColor, -35),
    T: av.topColor, t: av.topAccent || shade(av.topColor, -50), K: av.belt || INK,
    B: av.bottomColor, F: av.shoes || "#2a2236",
    A: av.hatColor || "#c0392b", a: shade(av.hatColor || "#c0392b", -45),
    G: INK, g: "#bfe6ff", C: av.extraColor || "#c0392b", c: shade(av.extraColor || "#c0392b", -45),
  };
  return { rows: grid.map((r) => r.join("")), pal };
}
// Draw with an automatic 1px outline (all packs could share this or ship outlined art).
function drawAvatar(ctx, av, x, y, flip = false) {
  const { rows, pal } = compose(av);
  const at = (cx, cy) => cy >= 0 && cy < GH && cx >= 0 && cx < G && rows[cy][cx] !== ".";
  for (let cy = -1; cy <= GH; cy++) for (let cx = -1; cx <= G; cx++) {
    const ox = flip ? G - 1 - cx : cx;
    if (at(cx, cy)) { ctx.fillStyle = pal[rows[cy][cx]] || "#f0f"; ctx.fillRect(x + ox, y + cy, 1, 1); }
    else if (at(cx - 1, cy) || at(cx + 1, cy) || at(cx, cy - 1) || at(cx, cy + 1)) { ctx.fillStyle = INK; ctx.fillRect(x + ox, y + cy, 1, 1); }
  }
}
function avatarCanvas(av, scale, { flip = false, crop = null, bg = null } = {}) {
  const c = document.createElement("canvas");
  const [sx, sy, sw, sh] = crop || [-1, -1, G + 2, GH + 2];
  c.width = sw * scale; c.height = sh * scale; c.className = "px";
  const s = document.createElement("canvas"); s.width = G + 2; s.height = GH + 2;
  drawAvatar(s.getContext("2d"), av, 1, 1, flip);
  const x = c.getContext("2d"); x.imageSmoothingEnabled = false;
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
  x.drawImage(s, sx + 1, sy + 1, sw, sh, 0, 0, c.width, c.height);
  return c;
}
const portrait = (av, scale, bg) => avatarCanvas(av, scale, { crop: [1, -1, 14, 12], bg });

// ================= cast (data) =================
const ME = { skin: 1, hair: "spiky", hairColor: "#2a2236", top: "hoodie", topColor: "#3fe0ff", topAccent: "#1f8fb0", bottom: "shorts", bottomColor: "#3b3f6b", hat: "none", extra: "scarf", extraColor: "#ff8f45" };
const MASTERS = [
  { n: "Master Granite", ti: "Stone Dojo", tr: "Stubborn", lv: 8, bg: "#c9c4b8",
    av: { skin: 2, hair: "none", top: "gi", topColor: "#8a8fa8", topAccent: "#e7e9f5", bottom: "hakama", bottomColor: "#3b3f6b", hat: "band", hatColor: "#c0392b", extra: "none", hairColor: "#000000" },
    plays: "Leans on ✊ rock. Repeats after a win.", tell: "Cracks his knuckles before rock.", twist: "🛡 Starts every round shielded.", rw: "🥋 Stone Belt" },
  { n: "Sensei Fold", ti: "Paper Dojo", tr: "Patient", lv: 12, bg: "#f3e6c8",
    av: { skin: 0, hair: "bun", hairColor: "#e7e9f5", top: "gi", topColor: "#fff8e7", topAccent: "#c9b98f", belt: "#3c5aa8", bottom: "hakama", bottomColor: "#3c5aa8", hat: "none", extra: "glasses" },
    plays: "Never repeats a throw. Prefers ✋ paper.", tell: "Bows deeper before paper.", twist: "🤘 Can reverse from round 1.", rw: "🥋 Paper Belt" },
  { n: "Master Snip", ti: "Blade Dojo", tr: "Hot-headed", lv: 16, bg: "#ffc9b8",
    av: { skin: 3, hair: "spiky", hairColor: "#ff5d73", top: "jacket", topColor: "#1d1b2e", topAccent: "#ff5d73", bottom: "pants", bottomColor: "#2a2236", hat: "none", extra: "mask", extraColor: "#2a2236" },
    plays: "After a loss, throws what beats your last throw.", tell: "Shouts louder before switching.", twist: "⚡ Speed rounds: faster countdown.", rw: "🥋 Blade Belt" },
  { n: "Echo", ti: "Mirror Dojo", tr: "Copycat", lv: 20, bg: "#cfe8ff",
    av: { skin: 4, hair: "long", hairColor: "#9fd6ff", top: "tee", topColor: "#b98bff", bottom: "skirt", bottomColor: "#6a4fb3", hat: "none", extra: "none" },

const T = 16;
function drawStreet() {
  const W = 34, H = 20;
  const art = document.createElement("canvas"); art.width = W * T; art.height = H * T;
  const g = art.getContext("2d");
  let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const px = (x, y, c, w = 1, hh = 1) => { g.fillStyle = c; g.fillRect(x, y, w, hh); };
  for (let y = 0; y < H * T; y++) for (let x = 0; x < W * T; x++) { const r = rnd(); px(x, y, r < .06 ? "#55a845" : r < .085 ? "#77c95a" : "#5fb54d"); }
  const path = (tx, ty, tw, th) => { px(tx * T, ty * T, "#e3c58a", tw * T, th * T); for (let i = 0; i < tw * th * 6; i++) px(tx * T + rnd() * tw * T, ty * T + rnd() * th * T, "#cfae70", 2, 1); };
  path(0, 11, W, 3); path(15, 0, 3, 11);
  // fences
  for (let x = 0; x < W; x++) if (x < 14 || x > 18) { px(x * T, 10 * T + 6, "#8a5a3c", T, 3); px(x * T + 2, 10 * T, INK, 3, 11); px(x * T + 3, 10 * T + 1, "#c9925f", 1, 9); }
  // houses
  const house = (tx, ty, tw, th, roof, wall, sign) => {
    const X = tx * T, Y = ty * T, w = tw * T, hh = th * T, rh = Math.floor(hh * .5);
    px(X - 3, Y - 2, INK, w + 6, rh + 4); px(X - 2, Y - 1, roof, w + 4, rh + 2);
    for (let i = 0; i < rh; i += 4) px(X - 2, Y + i, shade(roof, -25), w + 4, 1);
    px(X - 1, Y + rh, INK, w + 2, hh - rh + 1); px(X, Y + rh, wall, w, hh - rh);
    px(X + w / 2 - 7, Y + hh - 16, INK, 14, 16); px(X + w / 2 - 6, Y + hh - 15, "#6b4226", 12, 15);
    for (const wx of [X + 8, X + w - 22]) { px(wx - 1, Y + rh + 6, INK, 16, 12); px(wx, Y + rh + 7, "#9fd6ff", 14, 10); }
    if (sign) { g.font = "bold 9px Atkinson Hyperlegible"; g.textAlign = "center"; px(X + w / 2 - 26, Y + rh - 12, INK, 52, 13); px(X + w / 2 - 25, Y + rh - 11, "#fff8e7", 50, 11); g.fillStyle = INK; g.fillText(sign, X + w / 2, Y + rh - 2.5); }
  };
  house(2, 3, 9, 6, "#c0392b", "#efe2c2", "STONE DOJO");
  house(21, 2, 7, 6, "#3c5aa8", "#fff8e7", "BAKERY");
  house(4, 15, 7, 4, "#3fa86b", "#efe2c2");
  const tree = (tx, ty) => { const X = tx * T, Y = ty * T; px(X + 6, Y + 10, "#6b4226", 4, 8); g.fillStyle = INK; g.beginPath(); g.arc(X + 8, Y + 6, 9, 0, 7); g.fill(); g.fillStyle = "#3d8a3a"; g.beginPath(); g.arc(X + 8, Y + 6, 8, 0, 7); g.fill(); g.fillStyle = "#57a84b"; g.beginPath(); g.arc(X + 6, Y + 4, 4, 0, 7); g.fill(); };
  [[13, 2], [13, 5], [19, 6], [30, 3], [31, 7], [0, 16], [26, 16], [29, 17], [14, 16], [22, 17]].forEach(([x, y]) => tree(x, y));
  // flowers
  for (let i = 0; i < 40; i++) { const x = rnd() * W * T, y = (15 + rnd() * 5) * T; px(x, y, ["#ffd23f", "#ff8fb1", "#ffffff"][i % 3], 2, 2); }
  return { art, W, H, g };
}
